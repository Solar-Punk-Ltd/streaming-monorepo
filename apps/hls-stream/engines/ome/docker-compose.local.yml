# Deliberately declares no `ports:`, for the reason engines/srs/docker-compose.local.yml gives. Compose
# concatenates port lists across overlaid files rather than replacing them, so repeating a mapping here
# adds a second claim on the same host port and `docker compose up` fails on allocation. The base
# file's mappings are the only ones, and they already carry OME_HTTP_BIND, OME_SRT_BIND and the
# configured ports on both sides.
services:
  ome:
    environment:
      OME_ADAPTER_HOST: host.docker.internal
    extra_hosts:
      - 'host.docker.internal:host-gateway'
