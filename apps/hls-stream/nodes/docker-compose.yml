services:
  bee-uploader:
    image: ethersphere/bee:2.8.2@sha256:c0c951f0795e813be6b865213e2c277fd1449f862bb4b6357085391c4fb54810
    container_name: bee-uploader
    env_file: ../.env
    restart: unless-stopped
    ports:
      # The API has no password, so it defaults to the bridge address or 127.0.0.1. See deploy/.
      - '${BEE_UPLOADER_API_BIND:-${DOCKER_BRIDGE_ADDRESS:-127.0.0.1}}:${BEE_UPLOADER_API_PORT:-1633}:1633'
      - '${BEE_UPLOADER_P2P_BIND:-0.0.0.0}:${BEE_UPLOADER_P2P_PORT:-1634}:1634'
    volumes:
      - ${BEE_UPLOADER_DATA_DIR:-./data/bee-uploader}:/home/bee/.bee
    command:
      - start
      - --api-addr=:1633
      - --p2p-addr=:1634
      - --blockchain-rpc-endpoint=${RPC_ENDPOINT:-https://rpc.gnosischain.com}
      - --full-node=${BEE_UPLOADER_FULL_NODE:-false}
      - --swap-enable=true
      - --nat-addr=${BEE_UPLOADER_NAT_ADDR:-localhost}:${BEE_UPLOADER_P2P_PORT:-1634}
      - --verbosity=${BEE_VERBOSITY:-5}
      - --password=${BEE_UPLOADER_PASSWORD:-}

  bee-gateway:
    image: ethersphere/bee:2.8.2@sha256:c0c951f0795e813be6b865213e2c277fd1449f862bb4b6357085391c4fb54810
    container_name: bee-gateway
    env_file: ../.env
    restart: unless-stopped
    ports:
      - '${BEE_GATEWAY_API_BIND:-${DOCKER_BRIDGE_ADDRESS:-127.0.0.1}}:${BEE_GATEWAY_API_PORT:-1733}:1633'
      - '${BEE_GATEWAY_P2P_BIND:-0.0.0.0}:${BEE_GATEWAY_P2P_PORT:-1734}:1634'
    volumes:
      - ${BEE_GATEWAY_DATA_DIR:-./data/bee-gateway}:/home/bee/.bee
    command:
      - start
      - --api-addr=:1633
      - --p2p-addr=:1634
      - --full-node=false
      - --swap-enable=false
      - --cache-capacity=${BEE_GATEWAY_CACHE_CAPACITY:-1000000}
      # The only node here a browser reads through, which is why bee-uploader above does not carry
      # this. On a node holding a postage batch it lets any page that can route here read the full
      # batch ids and spend them. See deploy/docker-compose.yml.
      - --cors-allowed-origins=*
      - --nat-addr=${BEE_GATEWAY_NAT_ADDR:-localhost}:${BEE_GATEWAY_P2P_PORT:-1734}
      - --verbosity=${BEE_VERBOSITY:-5}
      - --password=${BEE_GATEWAY_PASSWORD:-}
