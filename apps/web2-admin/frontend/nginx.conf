# Mirrors the dev-time proxy in vite.config.ts: /api goes to the backend,
# everything else falls through to index.html so the SPA router handles it.

upstream web2_admin_api {
    server api:9877;
}

# The scheme the browser actually used. nginx listens on plain 80, so $scheme is
# always "http" here and would overwrite what a TLS edge in front reports. The
# API reads this to decide whether the session cookie may be marked Secure, and
# a Secure cookie that did not arrive over TLS is dropped by the browser, so
# guessing either way loops the login.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

# Who the browser is, when the host's TLS edge is the one talking to us. The
# edge (deploy/edge/) runs on the host's network and reaches this container
# through the loopback port it is published on, so every request through it
# arrives from the project network's bridge gateway. Without this, that gateway
# would be every request's last X-Forwarded-For hop, and the API's per-address
# login lockout would count the whole internet as one visitor — as would the
# `login` zone below, which is keyed on the same address. Docker draws a
# network's subnet, gateway included, from these three ranges. A tunnel or any
# other process on the host arrives the same way, so a client there can name
# whatever address it likes; reaching the host's loopback at all already means
# an account on the host.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# The API counts a failed login only after hashing the password it was given,
# and that hash is deliberately slow. A flood therefore costs the host dearly
# before the API's own lockout has said a word. Ten attempts a minute per
# address, five of which may arrive at once.
limit_req_zone $binary_remote_addr zone=login:1m rate=10r/m;

# Host is forwarded verbatim ($http_host, not $host) because it keeps the port,
# as in the manager. The API refuses a write whose Origin does not name the
# Host it was sent to, and a browser on the tunnel at localhost:8081 sends the
# port in both; $host dropped it, and every sign-in was refused as cross-site.
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Login, rate limited by the zone above. An exact match beats the /api/
    # prefix below whatever the order, and it is kept first so the file reads
    # the way nginx resolves it. 429 rather than nginx's default 503, because
    # that is what the console reads as "too many attempts" — the same status
    # the API's own lockout answers, and the console falls back to the
    # Retry-After header here since this refusal carries no JSON body.
    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://web2_admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # The whole API lives under /api. Thumbnail PUTs carry up to 5MB of image
    # bytes, so the body limit has to clear that with room for the envelope.
    location /api/ {
        proxy_pass http://web2_admin_api;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        client_max_body_size 6m;
    }

    # SPA fallback — every other path serves the built index.html. The console
    # uses a HashRouter, so this only ever has to answer for `/`.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
