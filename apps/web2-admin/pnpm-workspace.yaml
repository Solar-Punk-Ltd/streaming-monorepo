# Every app or library in this monorepo is a workspace package.
# web2-admin is split like streaming-infra-manager: backend (API) and frontend (console).
packages:
  - backend
  - frontend
  - common

# Every dependency is added at its exact version. It was save-exact in .npmrc, which pnpm 11 reads
# for registry and login settings alone.
saveExact: true

# pnpm 11 refuses an install when a dependency's build script is neither allowed nor refused, where
# pnpm 10 skipped it with a warning. esbuild's script checks that its binary for the platform runs, and
# the stack and the manager allow it too.
allowBuilds:
  esbuild: true
