# The web2 admin's checks: type checks and the unit suites of common, backend
# and frontend, and the backend's integration suite against a real Postgres.
# The admin's test script also runs the deploy scripts' tests, the edge's
# among them, so a change under infra/edge starts this workflow too. Those
# tests run tools/app-workspace as well, so a change there starts it too, and
# so does a change under packages/, the shared packages the admin imports.
name: web2-admin

on:
  push:
    branches: [main, main-v3]
    paths:
      [
        'apps/web2-admin/**',
        'infra/edge/**',
        'tools/app-workspace/**',
        'packages/**',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        '.oxlintrc.json',
        '.oxfmtrc.json',
        '.github/workflows/web2-admin.yml',
      ]
  pull_request:
    paths:
      [
        'apps/web2-admin/**',
        'infra/edge/**',
        'tools/app-workspace/**',
        'packages/**',
        'package.json',
        'pnpm-lock.yaml',
        'pnpm-workspace.yaml',
        '.oxlintrc.json',
        '.oxfmtrc.json',
        '.github/workflows/web2-admin.yml',
      ]

permissions:
  contents: read

concurrency:
  group: web2-admin-${{ github.ref }}
  cancel-in-progress: true

# Run steps only. An action reads the files it is handed from the repository
# root, so each one names its file under apps/web2-admin/ itself.
defaults:
  run:
    working-directory: apps/web2-admin

# The jobs carry the app's name because a required check is matched by its
# name, and the other root workflows already have jobs named checks and
# integration.
jobs:
  web2-admin-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Pinned by commit, the tag in the comment, the same pins as the
      # infra-manager workflow. pnpm comes from packageManager.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Type checks, every package, tests included
        run: pnpm run typecheck

      - name: Lint, every package, with oxlint and the root .oxlintrc.json
        run: pnpm lint

      - name: Formatting, with oxfmt and the root .oxfmtrc.json
        run: pnpm format:check

      - name: Unit tests, every package
        run: pnpm run test

  web2-admin-integration:
    # The suite starts a backend of its own under tsx with FEED_GATEWAY=fake,
    # and creates and drops a database of its own beside DATABASE_URL.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        # The postgres:16.15-alpine the admin runs, at the digest the
        # infra-manager workflow pins. The role is the image's superuser, as
        # in backend/docker-compose.yml, because the suite creates databases.
        # Trust authentication because the server starts empty, holds
        # synthetic rows for one job, and is reachable only from it.
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: web2admin
          POSTGRES_DB: web2admin
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U web2admin -d web2admin"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Integration suite, against a backend and a database of its own
        # BEE_URL and POSTAGE_BATCH_ID stay unset, so the one suite that needs
        # a real Bee node and a usable postage batch reports itself skipped.
        env:
          DATABASE_URL: postgres://web2admin@127.0.0.1:5432/web2admin
        run: pnpm -C backend run test:integration

  web2-admin-images:
    # The api and web images, built the way deploy/deploy.sh builds them: from
    # a copy of the admin's folder that tools/app-workspace/in-copy.mjs makes,
    # with the admin's own lockfile pair cut out of the root's, and the
    # Dockerfiles deploy/docker-compose.yml names. The other jobs run the code
    # from pnpm install on the runner and never build an image, so a Dockerfile
    # that no longer builds goes red here rather than at a deploy. Built and
    # thrown away, never pushed.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Node's standard library alone, which in-copy.mjs needs.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: The daemon the images are built with
        run: docker version --format 'server {{.Server.Version}}'

      - name: The api image, backend/Dockerfile
        run: node ../../tools/app-workspace/in-copy.mjs --app apps/web2-admin -- docker build --file backend/Dockerfile --tag web2-admin-api:checks .

      - name: The web image, frontend/Dockerfile
        run: node ../../tools/app-workspace/in-copy.mjs --app apps/web2-admin -- docker build --file frontend/Dockerfile --tag web2-admin-web:checks .
