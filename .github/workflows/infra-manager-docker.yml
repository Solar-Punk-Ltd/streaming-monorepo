# The Docker-backed run: the container-backed regressions and the signed-in
# integration suite, real containers built and started here and nowhere else.
# By hand, since it takes minutes and builds images. Not a required check.
#
# Five jobs, so one failure never hides another and each shows by name in the
# run: the SRS parser on eight files at once, the OvenMediaEngine admission
# gate, the shared image race, the stack version builder run for real, and the
# deployment integration suite that carries T01's startup failure. The first
# four need Docker and this repository, no manager and no secret.
#
# What each proves and what it does not: docs/ci.md.
name: infra-manager docker-backed checks

on:
  workflow_dispatch:
  # GitHub starts a by-hand workflow only when its file is on the default
  # branch, which is still main. Until this file reaches main, adding the
  # label docker-checks to a pull request starts the same run.
  pull_request:
    types: [labeled]

permissions:
  contents: read

# Run steps only. An action reads the files it is handed from the repository
# root, so each one names its file under apps/infra-manager/ itself. A step
# that runs before the checkout, or whether or not it ran, names the workspace
# instead, because apps/infra-manager does not exist until the checkout has
# run. A step's own working-directory replaces this default rather than
# nesting under it, so those name the whole path from the repository root.
defaults:
  run:
    working-directory: apps/infra-manager

jobs:
  srs-parser:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'docker-checks'
    # T02. Eight concurrent checks through the manager's own checker, on the
    # engine image the stack runs. Every refusal has to name the directive of
    # its own file, which is what a shared scratch copy would break.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter @streaming-infra-manager/common build

      - name: The daemon this ran on
        run: docker version --format 'server {{.Server.Version}}'

      - name: SRS parser isolation, eight files at once
        run: bash manager/test/docker/srs-check-isolation.sh

  ome-gate:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'docker-checks'
    # T03. SRT in, signed admission out, HLS playlist served, all in throwaway
    # containers on a private network. No funds, no Swarm, no host.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The daemon this ran on
        run: docker version --format 'server {{.Server.Version}}'

      - name: OvenMediaEngine admission gate
        run: bash manager/test/docker/ome-admission-gate.sh

  image-race:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'docker-checks'
    # T05a. The shared image tag reproduced and closed on throwaway projects.
    # The versions this ran on are in the harness output, and they are not the
    # Engine 29.1.3 and Compose 5.1.4 pair the qualification names. That
    # qualification stays a separate obligation, see docs/ci.md.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The daemon and Compose this ran on
        # The harness prints them too. This step puts them in the log before
        # any build, so a run that dies mid-build still says what it was on.
        run: |
          docker version --format 'server {{.Server.Version}}'
          docker compose version --short

      - name: Shared image race
        run: bash manager/test/docker/shared-image-race.sh

  version-build:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'docker-checks'
    # The stack version builder on the commit under test, for real: the cut of
    # the stack's lockfile, the install with the pnpm the stack names and the
    # build, all in its node:22-alpine container, then a check of what it left
    # for the manager. The unit suite runs the same script with Docker stubbed.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Node's standard library alone, for the builder's read of the stack's
      # packageManager and for the cut the harness compares with.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: The daemon this ran on
        run: docker version --format 'server {{.Server.Version}}'

      - name: The version builder on this commit
        # The commit this run checked out, which the builder fetches again from
        # the repository on GitHub, as a manager fetches a version.
        env:
          REPOSITORY: ${{ github.repository }}
        run: bash manager/test/docker/stack-version-build.sh "$GITHUB_SHA" "https://github.com/$REPOSITORY.git"

  integration:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'docker-checks'
    # T10, and now T01's container-backed startup failure. The manager on the
    # runner with Postgres beside it, real deployments created and removed.
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        # The same pin the checks workflow uses, digest resolved 2026-09-27.
        # Trust authentication because the database starts empty, holds
        # synthetic rows for one job, and is reachable only from it.
        image: postgres:16.15-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: manager
          POSTGRES_DB: manager
          POSTGRES_HOST_AUTH_METHOD: trust
        # Loopback only, as in the checks workflow.
        ports:
          - 127.0.0.1:5432:5432
        options: >-
          --health-cmd "pg_isready -U manager"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgres://manager@localhost:5432/manager
      SHLS_ROOT: ${{ github.workspace }}/apps/hls-stream
      MANAGER_URL: http://localhost:9876
    steps:
      - name: Refuse to start without the sign-in secret
        # The suite signs in as the user created below. A missing secret fails
        # here, in words, rather than as a refused login minutes in. Only
        # whether it is set is looked at, never the value.
        env:
          ITEST_PASSWORD: ${{ secrets.ITEST_PASSWORD }}
        working-directory: ${{ github.workspace }}
        run: |
          if [ -z "$ITEST_PASSWORD" ]; then
            echo "The repository secret ITEST_PASSWORD is not set. It is the password of the user the suite signs in as." >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          package_json_file: package.json
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: .
      - run: pnpm --filter @streaming-infra-manager/common build
      - run: pnpm --filter @streaming-infra-manager/api build

      - name: The roots the manager writes under
        # RUNNER_TEMP is a step-level value. A job-level `env:` cannot read the
        # runner context at all, and a workflow that tries is rejected whole,
        # which is what kept this file from ever starting.
        run: |
          echo "BEE_DATA_ROOT=$RUNNER_TEMP/streaming-infra-manager-data" >> "$GITHUB_ENV"
          echo "STACK_VERSIONS_ROOT=$RUNNER_TEMP/streaming-infra-manager-versions" >> "$GITHUB_ENV"

      - name: Start the manager, which runs the migrations
        working-directory: apps/infra-manager/manager
        run: |
          mkdir -p "$BEE_DATA_ROOT" "$STACK_VERSIONS_ROOT"
          # The bundled stack is apps/hls-stream at the commit under test, and
          # the manager reads its pin from the file beside that folder.
          git rev-parse HEAD > "$SHLS_ROOT/../.stack-commit"
          # Production's API runs as root and can remove Bee-owned directories.
          # Keep the test client unprivileged and elevate only that API process.
          NODE_BIN="$(command -v node)"
          nohup sudo --preserve-env=DATABASE_URL,SHLS_ROOT,STACK_VERSIONS_ROOT,BEE_DATA_ROOT \
            "$NODE_BIN" dist/index.js > "$RUNNER_TEMP/manager.log" 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "$MANAGER_URL/health" > /dev/null; then exit 0; fi
            sleep 1
          done
          echo "the manager did not answer /health within 30 s" >&2
          cat "$RUNNER_TEMP/manager.log" >&2
          exit 1

      - name: Wait for the pinned immutable bundled build
        working-directory: apps/infra-manager/manager
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { join } from 'node:path';
          import pg from 'pg';
          const expectedCommit = readFileSync(join(process.env.SHLS_ROOT, '..', '.stack-commit'), 'utf8').trim();
          const expectedRoot = join(process.env.STACK_VERSIONS_ROOT, 'bundled');
          const pool = new pg.Pool({ connectionString: process.env.DATABASE_URL });
          const deadline = Date.now() + 10 * 60_000;
          let ready = false;
          try {
            while (Date.now() < deadline) {
              const { rows: [row] } = await pool.query(
                `SELECT status, layout, build_id, commit_sha, root_path, last_error
                   FROM stack_versions WHERE name = $1`,
                ['bundled'],
              );
              if (row?.status === 'failed') {
                throw new Error(`Bundled build failed: ${row.last_error ?? 'no reason recorded'}`);
              }
              ready = row?.status === 'ready'
                && row.layout === 'builds'
                && Boolean(row.build_id)
                && row.commit_sha === expectedCommit
                && row.root_path === expectedRoot;
              if (ready) break;
              await new Promise(resolve => setTimeout(resolve, 2000));
            }
            if (!ready) throw new Error('Pinned immutable build was not ready within 10 minutes');
            console.log(`Ready: immutable bundled build of ${expectedCommit}`);
          } finally {
            await pool.end();
          }
          NODE

      - name: Create the user the suite signs in as
        # The CLI takes the password on stdin and nowhere else. Node hands it
        # over from the step's own environment, so no shell writes it out.
        env:
          ITEST_PASSWORD: ${{ secrets.ITEST_PASSWORD }}
        working-directory: apps/infra-manager/manager
        run: node -e "process.stdout.write(process.env.ITEST_PASSWORD ?? '')" | node dist/cli.js user:add itest --password-stdin

      - name: Integration suite, signed in, against the manager on this runner
        # This is where T01's engine-startup-failure file runs, for the first
        # time. It stores a config file SRS parses and dies on, and asserts the
        # rollout puts the previous file back with the deployment up on it.
        env:
          MANAGER_TEST_TARGET: http://localhost:9876
          MANAGER_TEST_USERNAME: itest
          MANAGER_TEST_PASSWORD: ${{ secrets.ITEST_PASSWORD }}
          MANAGER_TEST_RUN: ci${{ github.run_number }}
        run: pnpm --filter @streaming-infra-manager/api test:integration

      - name: Manager log
        if: always()
        working-directory: ${{ github.workspace }}
        run: cat "$RUNNER_TEMP/manager.log"
