name: hls-stream

on:
  # A change under tools/app-workspace starts it too, because the deploy
  # scripts' tests run that tool.
  push:
    branches: [main, main-v3]
    paths: ['apps/hls-stream/**', 'tools/app-workspace/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/hls-stream.yml']
  pull_request:
    paths: ['apps/hls-stream/**', 'tools/app-workspace/**', 'package.json', 'pnpm-lock.yaml', 'pnpm-workspace.yaml', '.github/workflows/hls-stream.yml']
  # An advisory gets published against a tree nobody has touched, so the audit
  # job needs a trigger that is not a diff. Two limits to know before relying on
  # it. GitHub only runs scheduled workflows on the default branch, so this
  # covers main and nothing else until a branch lands there. And GitHub disables
  # a schedule after 60 days of repository inactivity, silently, which is
  # precisely the dormant case the trigger exists for.
  schedule:
    - cron: '17 6 * * 1'

# Every job here only reads the checked out tree. Declared explicitly so the
# grant does not silently widen if the repository default is ever changed.
permissions:
  contents: read

concurrency:
  # The event name is in the key because `github.ref` is `refs/heads/main` for a
  # scheduled run and for a push to main alike, so without it the weekly audit
  # sweep and ordinary activity on main cancel each other. A cancelled run reports
  # as cancelled rather than failed and notifies nobody, so the one trigger that
  # exists to catch an advisory against an untouched tree was the one that could
  # be killed in silence.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

# Run steps only. An action reads the files it is handed from the repository
# root, so each one names its file under apps/hls-stream/ itself.
defaults:
  run:
    working-directory: apps/hls-stream

jobs:
  verify:
    name: verify (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 22 is engines.node, the node:22-alpine production image, and what the
        # team runs locally. One entry because those three now agree. Add a
        # version here only when something is actually supposed to run on it.
        node: [22]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # Before the tests, not after, because some of them read what it produces.
      #
      # `uploaderImage.test.js` asserts that the shared package vendored into the
      # uploader image still advertises every entry point the source does, and it
      # reads `packages/stream-uploader/dist/node_modules/...` to do it. With the
      # build afterwards that file does not exist on a clean checkout, so those
      # two tests failed on every CI run while passing on any machine that had
      # built once. A test that only passes on leftover state is worse than no
      # test: it reports green locally and red where it matters.
      #
      # The build also earns its own keep here. A build-tool upgrade once shipped
      # a silent browser-target change, because typecheck, lint and the client's
      # unit tests all pass without a bundler ever running. This does not check
      # what the bundle contains, only that one can be produced, which is the
      # cheap half of a gap recorded in full as TEST-22.
      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  audit:
    name: audit
    runs-on: ubuntu-latest
    # A registry that accepts the connection and never answers would otherwise
    # sit against GitHub's 6 hour default and then report as cancelled, which
    # reads as benign. This makes a hung audit go red.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # Kept out of `pnpm verify` on purpose. This is the one check that needs
      # the registry, and the local loop stays runnable on a train. The gate
      # fails on an advisory nobody has written down and equally on an allowlist
      # entry that has stopped matching, which is what stops the exception list
      # from quietly outliving its reasons.
      #
      # Report only until phase 4's security step replaces this gate. In the one
      # workspace `pnpm audit` reads the root lockfile, so the gate also meets
      # the admin's and the manager's advisories, which its allowlist was never
      # written for, and it would fail every pull request of the stack. The
      # step still shows when the gate fails, but the job passes.
      - name: Dependency advisories
        continue-on-error: true
        run: pnpm audit:check

      # The whole report as pnpm prints it, report only for the same reason.
      # The gate above can stop before printing any of it: an advisory with
      # findings at two versions, as the other apps' trees hold, breaks the
      # count check it makes before it reads the report.
      - name: Dependency advisories, the whole report
        continue-on-error: true
        run: pnpm audit

  shell:
    name: shell
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned by digest rather than by tag. ShellCheck is pre-installed on the
      # GitHub runner image and `stable` is a moving tag, so either of those
      # would let a version bump land new findings in a pull request that never
      # touched a shell script. This is the exact 0.11.0 image the baseline in
      # .shellcheckrc was argued against.
      #
      # --severity=style is the strictest level, which is the point: the
      # exceptions live in .shellcheckrc where each one carries its reason, so a
      # finding that is not on that list fails here.
      #
      # The file list has to stay in step with the `shellcheck` script in the root
      # package.json, which is the copy a developer runs. The two silently diverged
      # once: the root script was widened from `engines/*/entrypoint.sh` to
      # `engines/*/*.sh` for `engines/srs/healthcheck.sh`, this copy was not, and
      # 89 lines of new shell running as a container healthcheck went unlinted in
      # the only place that gates a merge. Nothing runs `pnpm shellcheck` in CI, so
      # widening one does not widen the other.
      - name: ShellCheck
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            koalaman/shellcheck@sha256:bb596a0d169b85ddd81d8b6d3a2ff6d5baf5fca10b97f575ebc647c3dff62b3d \
            --severity=style --format=gcc \
            deploy/scripts/*.sh nodes/*.sh engines/*/*.sh e2e/*.sh

  format:
    name: format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: .

      # The stack's whole folder, through oxfmt and the root .oxfmtrc.json. oxfmt
      # skips what git ignores and what that file's ignorePatterns name, so the
      # result does not depend on untracked files on whoever's machine it ran.
      - name: Check formatting
        run: pnpm format:check
