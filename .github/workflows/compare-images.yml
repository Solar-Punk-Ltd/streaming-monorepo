# Builds every image the manifest, tools/move-check/images.json, names twice,
# once from the pull request's base and once from the pull request merged into
# it, and compares each pair file by file with tools/move-check/images.mjs. A
# pull request that changes no image should see every pair match, and one that
# changes an image shows how, down to the file.
#
# Each side is built as its own commit's copy of the manifest says, so a pull
# request that changes how an image builds changes the manifest with it. What
# may differ is the head's copy's to say. pnpm's own files are listed by name
# whenever they differ, so a pnpm version change shows as one.
#
# Every image is built with its Dockerfile's default build arguments, not the
# ones a deploy passes, so a defect in those does not show here.
#
# Started by adding the label compare-images to a pull request, and again by
# removing it and adding it back, because its sixteen builds run without a
# cache.
name: compare-images

on:
  pull_request:
    types: [labeled]

permissions:
  contents: read

jobs:
  compare:
    if: github.event.label.name == 'compare-images'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      # Pinned by commit, the tag in the comment, as the repository's other workflows pin them.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The pull request merged into its base, and that merge's two parents. The first parent is the base.
          fetch-depth: 2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Plan, which stops before any build when a commit, context or Dockerfile is missing
        run: node tools/move-check/images.mjs --manifest tools/move-check/images.json --base HEAD^1 --head HEAD --plan

      - name: Build and compare
        run: |
          set -o pipefail
          node tools/move-check/images.mjs --manifest tools/move-check/images.json --base HEAD^1 --head HEAD --remove-images | tee images-report.txt

      - name: Put the report on the run's page
        if: always()
        run: |
          if [ -f images-report.txt ]; then
            { echo '```text'; cat images-report.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
