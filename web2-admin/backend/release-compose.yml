# Guarded admin deployment. The installed release guard supplies the project,
# exact database volume, loopback port, immutable images and active artifact.
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: web2admin
      POSTGRES_USER: web2admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - web2admin-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U web2admin -d web2admin"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: web2-admin/backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ${ADMIN_RELEASE_ENV_FILE:?ADMIN_RELEASE_ENV_FILE is required}
    environment:
      DATABASE_HOST: postgres
      DATABASE_PORT: "5432"
      DATABASE_NAME: web2admin
      DATABASE_USER: web2admin
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      WEB2_ADMIN_HOST: 0.0.0.0
      WEB2_ADMIN_PORT: "9877"
      BEE_URL: ${BEE_URL:?BEE_URL is required}
      FEED_PRIVATE_KEY: ${FEED_PRIVATE_KEY:?FEED_PRIVATE_KEY is required}
      INGEST_MANAGED_LIFECYCLE_VERSION: ${INGEST_MANAGED_LIFECYCLE_VERSION:-}
      INGEST_MANAGED_UPLOADER_ID: ${INGEST_MANAGED_UPLOADER_ID:-}
      INGEST_SRT_PASSPHRASE: ${INGEST_SRT_PASSPHRASE:-}
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:?INTERNAL_API_TOKEN is required}
      POSTAGE_BATCH_ID: ${POSTAGE_BATCH_ID:?POSTAGE_BATCH_ID is required}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9877/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 24

  web:
    build:
      context: ../..
      dockerfile: web2-admin/frontend/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${RELEASE_WEB_PORT:?RELEASE_WEB_PORT is required}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  web2admin-pg:
    name: ${RELEASE_POSTGRES_VOLUME_NAME:-web2-admin_web2admin-pg}
